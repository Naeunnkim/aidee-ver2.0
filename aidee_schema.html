
<style>
#erd { padding: 1rem 0; }
</style>
<h2 style="position:absolute;left:-9999px">Aidee 리팩토링 DB 스키마</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a2a' : '#f4f3ee',
    primaryBorderColor: dark ? '#555' : '#aaa',
    attributeBackgroundColorEven: dark ? '#1e1e1e' : '#fafaf8',
    attributeBackgroundColorOdd: dark ? '#252525' : '#f0efe9',
  },
});
const diagram = `erDiagram
  profiles {
    uuid id PK
    string email
    string name
    timestamp created_at
  }
  projects {
    uuid id PK
    uuid user_id FK
    string title
    jsonb requirements
    string status
    timestamp created_at
  }
  messages {
    uuid id PK
    uuid project_id FK
    string role
    string active_agent
    text content
    int seq_order
    int gap_from_prev_ms
    boolean is_revision
    timestamp created_at
  }
  project_reference_images {
    uuid id PK
    uuid project_id FK
    string file_name
    string image_url
    string analysis_status
    text analysis_text
    jsonb analysis_json
    timestamp created_at
  }
  study_sessions {
    uuid id PK
    uuid user_id FK
    string status
    timestamp started_at
    timestamp ended_at
  }
  design_stages {
    uuid id PK
    uuid session_id FK
    uuid project_id FK
    string stage_key
    int stage_order
    int duration_ms
    int revision_count
    string exit_reason
    timestamp entered_at
    timestamp exited_at
  }
  agent_calls {
    uuid id PK
    uuid stage_id FK
    uuid message_id FK
    string from_agent
    string to_agent
    string trigger_reason
    timestamp called_at
  }
  stuck_events {
    uuid id PK
    uuid stage_id FK
    uuid message_id FK
    int gap_ms
    timestamp detected_at
  }
  inline_surveys {
    uuid id PK
    uuid stage_id FK
    string survey_type
    jsonb answers
    timestamp submitted_at
  }
  profiles ||--o{ projects : owns
  profiles ||--o{ study_sessions : participates
  projects ||--o{ messages : contains
  projects ||--o{ project_reference_images : has
  study_sessions ||--o{ design_stages : tracks
  design_stages ||--o{ agent_calls : records
  design_stages ||--o{ stuck_events : detects
  design_stages ||--o{ inline_surveys : collects
  projects ||--|| design_stages : linked
  messages ||--o{ agent_calls : triggers
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
